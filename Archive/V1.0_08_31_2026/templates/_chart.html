{% macro svg_bar_chart(chart, unit) %}
<svg viewBox="0 0 {{ chart.width }} {{ chart.height }}" class="chart-svg" role="img" aria-label="Bar chart">
  {% for g in chart.gridlines %}
  <line x1="{{ chart.plot_left }}" x2="{{ chart.plot_right }}" y1="{{ g.y }}" y2="{{ g.y }}" class="chart-gridline"/>
  <text x="{{ chart.plot_left - 6 }}" y="{{ g.y + 3 }}" class="chart-axis-label" text-anchor="end">{{ g.label }}</text>
  {% endfor %}
  <line x1="{{ chart.plot_left }}" x2="{{ chart.plot_left }}" y1="{{ chart.plot_top }}" y2="{{ chart.plot_bottom }}" class="chart-axis-line"/>
  {% for bar in chart.bars %}
    {% for seg in bar.segments %}
    <rect x="{{ bar.x }}" y="{{ seg.y }}" width="{{ bar.width }}" height="{{ seg.height }}" fill="{{ seg.fill }}" class="chart-bar-segment">
      <title>{{ bar.full_label }} — {{ seg.activity_type }}: {{ seg.value }} {{ unit }}</title>
    </rect>
    {% endfor %}
    {% if not bar.segments %}
    <rect x="{{ bar.x }}" y="{{ chart.plot_bottom - 1 }}" width="{{ bar.width }}" height="1" class="chart-bar-empty"/>
    {% endif %}
    <text x="{{ bar.x + bar.width / 2 }}" y="{{ chart.plot_bottom + 16 }}" class="chart-x-label" text-anchor="middle">{{ bar.label }}</text>
  {% endfor %}
</svg>
{% endmacro %}

{% macro chart_legend(legend) %}
{% if legend %}
<div class="chart-legend">
  {% for item in legend %}
  <span class="chart-legend-item">
    <span class="chart-swatch chart-swatch-{{ item.swatch }}" style="{{ '--swatch-color: ' ~ item.swatch_color ~ ';' if item.swatch_color else '' }}"></span>
    {{ item.activity_type }}
  </span>
  {% endfor %}
</div>
{% endif %}
{% endmacro %}
